name = "nle-cc"
main = "./cloudflare/worker.ts"
compatibility_date = "2026-09-30"
workers_dev = true

[build]
command = "PORT=5000 BASE_PATH=/ pnpm --filter @workspace/soundwave run build"

[assets]
directory = "./artifacts/soundwave/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
LOG_LEVEL = "info"

# Postgres on Workers goes through Hyperdrive (connection pooling).
# 1. wrangler hyperdrive create nle-db --connection-string="$DATABASE_URL"
# 2. Uncomment and fill in the id:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#
# Without Hyperdrive you can also set DATABASE_URL as a secret:
#   wrangler secret put DATABASE_URL
# (plain TCP Postgres from a Worker without Hyperdrive is slow; Hyperdrive is recommended)
